<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Divide la Cuenta</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f4f6f8;

    color: #1d252c;
}

.container {
    width: 100%;

    max-width: 1000px;

    margin: auto;

    padding: 20px;
}


/* =========================================================
   HEADER
========================================================= */

header {
    text-align: center;

    margin-bottom: 25px;
}

header h1 {
    margin: 0;

    font-size: 30px;

    font-weight: 800;
}

header p {
    margin: 7px 0 0;

    color: #68737d;
}


/* =========================================================
   FORMULARIO
========================================================= */

.add-box {

    background: white;

    padding: 18px;

    border-radius: 16px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.06);

    margin-bottom: 15px;
}

.form-row {

    display: flex;

    gap: 10px;
}

.form-row input {

    border:
        1px solid #d7dce1;

    border-radius: 10px;

    padding: 13px;

    font-size: 16px;

    outline: none;

    background: white;

    min-width: 0;
}

.form-row input:focus {

    border-color: #1677ff;
}

#productName {

    flex: 1;
}

#productPrice {

    width: 150px;
}


/* =========================================================
   BOTONES
========================================================= */

button {

    border: none;

    cursor: pointer;

    font-size: 15px;

    font-weight: 700;

    border-radius: 10px;

    padding: 12px 16px;
}

.add-btn {

    background: #1677ff;

    color: white;
}

.add-btn:hover {

    background: #0868e7;
}


/* =========================================================
   DIFERENCIA
========================================================= */

.summary {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 6px;

    margin:
        0 3px
        12px;

    font-size: 13px;

    color: #8a939b;
}

.summary-title {

    font-weight: 500;
}

.summary-difference {

    font-weight: 700;

    color: #69747e;
}


/* =========================================================
   LISTAS
========================================================= */

.lists {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 18px;
}

.person {

    background: white;

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 4px 18px rgba(0,0,0,.06);
}


/* =========================================================
   CABECERA LISTA
========================================================= */

.person-header {

    padding: 18px;

    background: #f7f8fa;

    border-bottom:
        1px solid #e8ebee;
}

.person-header h2 {

    margin: 0;

    font-size: 19px;
}

.person-total {

    margin-top: 7px;

    font-size: 26px;

    font-weight: 800;

    color: #1677ff;
}


/* =========================================================
   PRODUCTOS
========================================================= */

.product-list {

    padding: 10px;

    min-height: 100px;
}

.product {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding:
        12px 8px;

    border-bottom:
        1px solid #edf0f2;
}

.product:last-child {

    border-bottom: none;
}

.product-info {

    min-width: 0;

    flex: 1;
}

.product-name {

    font-size: 15px;

    font-weight: 600;

    word-break: break-word;
}

.product-price {

    font-size: 14px;

    color: #69747e;

    margin-top: 3px;
}


/* =========================================================
   BOTONES DE PRODUCTO
========================================================= */

.product-actions {

    display: flex;

    gap: 5px;

    flex-shrink: 0;
}

.small-btn {

    width: 34px;

    height: 34px;

    padding: 0;

    border-radius: 8px;

    background: #f0f2f4;

    color: #333;
}

.small-btn:hover {

    background: #e3e6e9;
}

.delete-btn {

    color: #d92828;
}


/* =========================================================
   LISTA VACÍA
========================================================= */

.empty {

    text-align: center;

    color: #9aa2a9;

    padding:
        25px 10px;

    font-size: 14px;
}


/* =========================================================
   BOTONES FINALES
========================================================= */

.bottom-actions {

    display: flex;

    gap: 10px;

    margin-top: 18px;
}

.action-btn {

    flex: 1;

    background: white;

    border:
        1px solid #dce1e5;

    color: #26313a;
}


/* REEQUILIBRAR — COLOR SUAVE */

.balance-btn {

    background: #e9edf0;

    color: #46515a;

    border:
        1px solid #d9dee2;
}

.balance-btn:hover {

    background: #dde2e6;
}


/* BORRAR */

.delete-all {

    background: white;

    border:
        1px solid #ffb7b7;

    color: #d92828;
}


/* =========================================================
   MODAL
========================================================= */

.modal-background {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.45);

    z-index: 100;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.modal {

    background: white;

    width: 100%;

    max-width: 400px;

    border-radius: 18px;

    padding: 25px;
}

.modal h3 {

    margin-top: 0;
}

.modal-buttons {

    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.modal-buttons button {

    flex: 1;
}

.cancel {

    background: #edf0f2;
}

.confirm {

    background: #d92828;

    color: white;
}


/* =========================================================
   RESPONSIVE CELULAR
========================================================= */

@media (max-width: 700px) {

    .container {

        padding: 10px;
    }


    /* HEADER */

    header {

        margin-bottom: 15px;
    }

    header h1 {

        font-size: 24px;
    }

    header p {

        font-size: 13px;
    }


    /* FORMULARIO */

    .add-box {

        padding: 12px;

        border-radius: 13px;
    }

    .form-row {

        display: grid;

        grid-template-columns:
            1fr 100px;

        gap: 8px;
    }

    #productPrice {

        width: 100%;
    }

    .add-btn {

        grid-column:
            1 / -1;
    }


    /* DIFERENCIA */

    .summary {

        font-size: 12px;

        margin:
            0 3px
            8px;
    }


    /* DOS COLUMNAS */

    .lists {

        grid-template-columns:
            1fr 1fr;

        gap: 8px;
    }


    /* LISTAS */

    .person {

        border-radius: 12px;
    }

    .person-header {

        padding:
            12px 8px;
    }

    .person-header h2 {

        font-size: 14px;

        white-space: nowrap;
    }

    .person-total {

        font-size: 20px;

        margin-top: 5px;
    }


    /* PRODUCTOS */

    .product-list {

        padding: 6px;
    }

    .product {

        padding:
            9px 3px;

        gap: 4px;
    }

    .product-name {

        font-size: 13px;

        line-height: 1.2;
    }

    .product-price {

        font-size: 12px;

        margin-top: 2px;
    }


    /* BOTONES PRODUCTO */

    .product-actions {

        gap: 3px;
    }

    .small-btn {

        width: 27px;

        height: 27px;

        font-size: 13px;

        border-radius: 6px;
    }


    /* BOTONES FINALES */

    .bottom-actions {

        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 8px;

        margin-top: 12px;
    }

    .action-btn {

        min-width: 0;

        padding:
            11px 5px;

        font-size: 13px;
    }

}


/* =========================================================
   CELULARES MUY PEQUEÑOS
========================================================= */

@media (max-width: 380px) {

    .container {

        padding: 7px;
    }

    header h1 {

        font-size: 22px;
    }

    .lists {

        gap: 5px;
    }

    .person-header {

        padding:
            10px 6px;
    }

    .person-header h2 {

        font-size: 12px;
    }

    .person-total {

        font-size: 18px;
    }

    .product-list {

        padding: 4px;
    }

    .product {

        padding:
            8px 2px;
    }

    .product-name {

        font-size: 12px;
    }

    .product-price {

        font-size: 11px;
    }

    .small-btn {

        width: 24px;

        height: 24px;

        font-size: 12px;
    }

}


/* =========================================================
   INPUTS
========================================================= */

/*
    IMPORTANTE:

    NO usamos inputmode en Precio.

    Esto permite que iOS/Android utilice
    el teclado de texto estándar, que incluye
    números y la tecla Enter.
*/

input {

    font-size: 16px;

    -webkit-appearance: none;

    appearance: none;
}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
====================================================== -->

<header>

    <h1>
        🛒 Divide la Cuenta
    </h1>

    <p>
        Reparte las compras de la forma más equilibrada posible.
    </p>

</header>


<!-- =====================================================
     AGREGAR PRODUCTO
====================================================== -->

<div class="add-box">

    <div class="form-row">


        <!-- PRODUCTO -->

        <input
            type="text"
            id="productName"
            placeholder="Nombre del producto"
            autocomplete="off"
            enterkeyhint="next"
        >


        <!--
            PRECIO

            Se utiliza type="text"
            y NO inputmode.

            De esta forma el dispositivo
            utiliza su teclado de texto estándar,
            manteniendo la tecla Enter.
        -->

        <input
            type="text"
            id="productPrice"
            placeholder="$ Precio"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
        >


        <!-- AGREGAR -->

        <button
            class="add-btn"
            type="button"
            onclick="addProduct()"
        >
            + Agregar
        </button>


    </div>

</div>


<!-- =====================================================
     DIFERENCIA
====================================================== -->

<div class="summary">

    <span class="summary-title">
        Diferencia:
    </span>

    <span
        class="summary-difference"
        id="difference"
    >
        $0
    </span>

</div>


<!-- =====================================================
     LISTAS
====================================================== -->

<div class="lists">


    <!-- LISTA 1 -->

    <div class="person">

        <div class="person-header">

            <h2>
                🛒 Lista 1
            </h2>

            <div
                class="person-total"
                id="total1"
            >
                $0
            </div>

        </div>


        <div
            class="product-list"
            id="list1"
        ></div>

    </div>


    <!-- LISTA 2 -->

    <div class="person">

        <div class="person-header">

            <h2>
                🛒 Lista 2
            </h2>

            <div
                class="person-total"
                id="total2"
            >
                $0
            </div>

        </div>


        <div
            class="product-list"
            id="list2"
        ></div>

    </div>


</div>


<!-- =====================================================
     BOTONES FINALES
====================================================== -->

<div class="bottom-actions">


    <button
        class="
            action-btn
            balance-btn
        "
        type="button"
        onclick="balanceProducts()"
    >
        ⚖️ Reequilibrar
    </button>


    <button
        class="
            action-btn
            delete-all
        "
        type="button"
        onclick="openDeleteModal()"
    >
        🗑️ Borrar todo
    </button>


</div>


</div>


<!-- =====================================================
     MODAL BORRAR
====================================================== -->

<div
    class="modal-background"
    id="deleteModal"
>

    <div class="modal">

        <h3>
            ¿Borrar todos los productos?
        </h3>

        <p>
            Se eliminarán todos los productos y se
            reiniciará la distribución.
        </p>

        <div class="modal-buttons">

            <button
                class="cancel"
                type="button"
                onclick="closeDeleteModal()"
            >
                Cancelar
            </button>

            <button
                class="confirm"
                type="button"
                onclick="deleteAll()"
            >
                Sí, borrar
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DATOS
========================================================= */

let products = [];

let nextId = 1;


/* =========================================================
   FORMATO MONEDA
========================================================= */

function money(value) {

    return new Intl.NumberFormat(
        "es-MX",
        {
            style: "currency",
            currency: "MXN",
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    ).format(value);

}


/* =========================================================
   CARGAR DATOS
========================================================= */

function loadData() {

    const saved =
        localStorage.getItem(
            "divideCuenta"
        );


    if (saved) {

        try {

            products =
                JSON.parse(saved);


            if (products.length > 0) {

                nextId =
                    Math.max(
                        ...products.map(
                            p => p.id
                        )
                    ) + 1;

            }

        }

        catch (error) {

            products = [];

        }

    }


    render();

}


/* =========================================================
   GUARDAR
========================================================= */

function saveData() {

    localStorage.setItem(
        "divideCuenta",
        JSON.stringify(products)
    );

}


/* =========================================================
   AGREGAR PRODUCTO
========================================================= */

function addProduct() {

    const nameInput =
        document.getElementById(
            "productName"
        );


    const priceInput =
        document.getElementById(
            "productPrice"
        );


    const name =
        nameInput.value.trim();


    /*
        Aceptar:

        25
        25.50
        25,50
        $25
        $25.50
    */

    let priceText =
        priceInput.value
            .trim()
            .replace(/\$/g, "")
            .replace(",", ".");


    const price =
        parseFloat(priceText);


    /* Validar producto */

    if (!name) {

        nameInput.focus();

        return;

    }


    /* Validar precio */

    if (
        isNaN(price) ||
        price <= 0
    ) {

        priceInput.focus();

        return;

    }


    /* Crear */

    products.push({

        id: nextId++,

        name: name,

        price: price,

        person: 1

    });


    /* Limpiar */

    nameInput.value = "";

    priceInput.value = "";


    /*
        Equilibrar automáticamente.
    */

    balanceProducts(false);


    /*
        Volver al producto.
    */

    nameInput.focus();

}


/* =========================================================
   ELIMINAR PRODUCTO
========================================================= */

function deleteProduct(id) {

    products =
        products.filter(
            product =>
                product.id !== id
        );


    saveData();

    render();

}


/* =========================================================
   MOVER PRODUCTO
========================================================= */

function moveProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    product.person =
        product.person === 1
            ? 2
            : 1;


    saveData();

    render();

}


/* =========================================================
   REEQUILIBRAR
========================================================= */

function balanceProducts(
    showAlert = true
) {

    if (
        products.length === 0
    ) {

        if (showAlert) {

            alert(
                "Primero agrega algunos productos."
            );

        }

        return;

    }


    const total =
        products.reduce(
            (sum, product) =>
                sum + product.price,
            0
        );


    const target =
        total / 2;


    /*
        Convertimos a centavos
        para evitar problemas
        con decimales.
    */

    const items =
        products.map(
            product => ({

                ...product,

                cents:
                    Math.round(
                        product.price * 100
                    )

            })
        );


    const targetCents =
        Math.round(
            target * 100
        );


    /*
        Programación dinámica.
    */

    const dp =
        new Map();


    dp.set(
        0,
        []
    );


    for (
        const item
        of items
    ) {

        const existing =
            Array.from(
                dp.entries()
            );


        for (
            const [
                sum,
                combination
            ]
            of existing
        ) {

            const newSum =
                sum + item.cents;


            if (
                newSum <= targetCents &&
                !dp.has(newSum)
            ) {

                dp.set(

                    newSum,

                    [
                        ...combination,
                        item.id
                    ]

                );

            }

        }

    }


    /*
        Encontrar suma más cercana
        a la mitad.
    */

    let bestSum = 0;


    for (
        const sum
        of dp.keys()
    ) {

        if (

            Math.abs(
                targetCents - sum
            )

            <

            Math.abs(
                targetCents - bestSum
            )

        ) {

            bestSum = sum;

        }

    }


    /*
        Productos de Lista 1.
    */

    const selectedIds =
        new Set(
            dp.get(bestSum)
        );


    /*
        El resto va a Lista 2.
    */

    products.forEach(
        product => {

            product.person =
                selectedIds.has(
                    product.id
                )
                    ? 1
                    : 2;

        }
    );


    saveData();

    render();

}


/* =========================================================
   MODAL
========================================================= */

function openDeleteModal() {

    if (
        products.length === 0
    ) {

        return;

    }


    document.getElementById(
        "deleteModal"
    ).style.display =
        "flex";

}


function closeDeleteModal() {

    document.getElementById(
        "deleteModal"
    ).style.display =
        "none";

}


/* =========================================================
   BORRAR TODO
========================================================= */

function deleteAll() {

    products = [];

    nextId = 1;


    localStorage.removeItem(
        "divideCuenta"
    );


    closeDeleteModal();

    render();

}


/* =========================================================
   RENDERIZAR
========================================================= */

function render() {

    const list1 =
        document.getElementById(
            "list1"
        );


    const list2 =
        document.getElementById(
            "list2"
        );


    list1.innerHTML = "";

    list2.innerHTML = "";


    let total1 = 0;

    let total2 = 0;


    /*
        Calcular totales.
    */

    products.forEach(
        product => {

            if (
                product.person === 1
            ) {

                total1 +=
                    product.price;

            }

            else {

                total2 +=
                    product.price;

            }

        }
    );


    /*
        Lista 1.
    */

    products
        .filter(
            product =>
                product.person === 1
        )
        .forEach(
            product => {

                list1.appendChild(
                    createProductElement(
                        product
                    )
                );

            }
        );


    /*
        Lista 2.
    */

    products
        .filter(
            product =>
                product.person === 2
        )
        .forEach(
            product => {

                list2.appendChild(
                    createProductElement(
                        product
                    )
                );

            }
        );


    /*
        Vacío.
    */

    if (

        products.filter(
            p => p.person === 1
        ).length === 0

    ) {

        list1.innerHTML = `
            <div class="empty">
                Sin productos
            </div>
        `;

    }


    if (

        products.filter(
            p => p.person === 2
        ).length === 0

    ) {

        list2.innerHTML = `
            <div class="empty">
                Sin productos
            </div>
        `;

    }


    /*
        Diferencia.
    */

    const difference =
        Math.abs(
            total1 - total2
        );


    /*
        Actualizar interfaz.
    */

    document.getElementById(
        "total1"
    ).textContent =
        money(total1);


    document.getElementById(
        "total2"
    ).textContent =
        money(total2);


    document.getElementById(
        "difference"
    ).textContent =
        money(difference);

}


/* =========================================================
   CREAR PRODUCTO
========================================================= */

function createProductElement(
    product
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "product";


    element.innerHTML = `

        <div class="product-info">

            <div class="product-name">

                ${escapeHTML(
                    product.name
                )}

            </div>

            <div class="product-price">

                ${money(
                    product.price
                )}

            </div>

        </div>


        <div class="product-actions">


            <button
                class="small-btn"
                type="button"
                title="Mover"
                onclick="
                    moveProduct(
                        ${product.id}
                    )
                "
            >
                ↔
            </button>


            <button
                class="
                    small-btn
                    delete-btn
                "
                type="button"
                title="Eliminar"
                onclick="
                    deleteProduct(
                        ${product.id}
                    )
                "
            >
                ×
            </button>


        </div>

    `;


    return element;

}


/* =========================================================
   PROTEGER HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent = text;


    return div.innerHTML;

}


/* =========================================================
   PRODUCTO
   ENTER → PRECIO
========================================================= */

document
    .getElementById(
        "productName"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();


                const priceInput =
                    document.getElementById(
                        "productPrice"
                    );


                priceInput.focus();


                priceInput.select();

            }

        }
    );


/* =========================================================
   PRECIO
   ENTER → AGREGAR
========================================================= */

document
    .getElementById(
        "productPrice"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                addProduct();

            }

        }
    );


/* =========================================================
   LIMPIAR CARACTERES NO VÁLIDOS
========================================================= */

document
    .getElementById(
        "productPrice"
    )
    .addEventListener(
        "input",
        function() {

            /*
                Permitimos solamente:

                0-9
                .
                ,
                $
            */

            this.value =
                this.value.replace(
                    /[^0-9.,$]/g,
                    ""
                );

        }
    );


/* =========================================================
   INICIAR
========================================================= */

loadData();

</script>

</body>
</html>
